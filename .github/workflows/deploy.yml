name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          # New homepage — served at /homepage/ (all relative links intact)
          cp -r homepage _site/homepage
          # Project case studies — homepage links use ../projects/ relative paths
          cp -r projects _site/projects
          # Shared resources used by project pages
          cp -r shared _site/shared
          # GitHub Pages config
          cp CNAME _site/CNAME
          cp .nojekyll _site/.nojekyll
          # Root: instant redirect to the new homepage
          cat > _site/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0;url=/homepage/">
            <link rel="canonical" href="/homepage/">
            <script>window.location.replace('/homepage/');</script>
          </head>
          <body></body>
          </html>
          HTMLEOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
